name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release metadata
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          if [ "$RELEASE_TAG" != "v$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

          if [[ "$package_version" == *-* ]]; then
            expected_prerelease=true
            dist_tag=next
          else
            expected_prerelease=false
            dist_tag=latest
          fi

          if [ "$RELEASE_PRERELEASE" != "$expected_prerelease" ]; then
            echo "GitHub prerelease status does not match package version $package_version" >&2
            exit 1
          fi

          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"

      - name: Verify the release is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Type-check
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Verify committed build output
        run: git diff --exit-code -- dist

      - name: Publish to npm
        run: npm publish --access public --tag "${{ steps.release.outputs.dist-tag }}"
